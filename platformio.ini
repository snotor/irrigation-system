[platformio]
default_envs = esp32dev

[env]
platform = espressif32@6.9.0      ; Arduino core 2.0.17, pinned for reproducibility
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
build_flags =
    -Wall
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    adafruit/Adafruit BME280 Library@2.2.4
    adafruit/Adafruit Unified Sensor@1.1.14
    makuna/Rtc@^2.4.2

[env:esp32dev]                    ; real firmware
; Bare-ESP32 bench without the PCB (button between GPIO4 and GPIO2): uncomment the next two lines.
 build_flags = ${env.build_flags}
     -DBENCH_BUTTON_GPIO2