[platformio]
default_envs = esp32dev

[env]
platform = espressif32@6.9.0      ; Arduino core 2.0.17, pinned for reproducibility
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.filesystem = littlefs
; 3 MB app, ~900 kB LittleFS for the log (no OTA)
board_build.partitions = huge_app.csv
; extra_scripts = pre:tools/build_pages.py
build_flags =
    -Wall
    -Isrc
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    adafruit/Adafruit BME280 Library@2.2.4
    adafruit/Adafruit Unified Sensor@1.1.14
    makuna/Rtc@^2.4.2
    bblanchon/ArduinoJson@7.4.2

[env:esp32dev]
