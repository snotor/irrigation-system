<script>
// ===== OFFLINE DEMO: a fake controller answering the /api/* calls of app.html v2 =====
// This is also the API contract the firmware has to implement (see API.md).
(function(){
  var NOW=function(){return Date.now()};
  function p2(n){return n<10?'0'+n:''+n}
  function lts(ms){var d=new Date(ms);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+' '+p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds())}
  function ymd(ms){var d=new Date(ms);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
  var boot=NOW()-3*3600e3-17*60e3, FOREVER=4102444800;
  var ALL=127;
  function Z(name,en,m,soil,plant,soilp,spr,sch){
    return {name:name,en:en,m:m,cold:4,cov:0,dnd:0,soil:soil,sf:0,
      plant:plant,soil_:soilp,spr:spr,sch:sch,dsch:[],today:0};
  }
  var M={
    name:'Kert',ver:'0.4.0-demo',hw:'ESP-WROOM32-CH340-USB-C',
    tankLow:0,rain:0,flt:0,rtcLost:0,envFault:0,sf3:0,drift:0,weakWifi:0,
    g:{off:0,dnd:0,dsch:[{sid:90,d:0x60,s:540,e:780}]},
    S:{name:'Kert',frost:2,cap:90,rainmm:2,qto:120,lat:47.4979,lon:19.0402,flow:2.1,tankE:72,tankF:8,
       cmode:1,cpw:620,cpe:70,cpp:550,cur:'Ft',clog:6,btn:1,buzz:1,
       soilCal:[{dry:3020,wet:1310},{dry:2985,wet:1290},{dry:3050,wet:1335},{dry:3000,wet:1300}]},
    az:-1,runStart:0,tot:0,runSrc:'MANUAL',soilAt:0,queue:[],
    c:12.4,h:71,p:1013,tankCm:38.5,
    z:[
      Z('Front lawn',1,0,46,{p:'lawn',kc:.9,root:15,lo:35,hi:50},{p:'loam',fc:27,wp:12,inf:13},{p:'mist',rate:20,eff:70},[{sid:1,d:0x15,s:390,sec:600}]),
      Z('Back lawn',1,1,33,{p:'lawn',kc:.9,root:15,lo:35,hi:50},{p:'loam',fc:27,wp:12,inf:13},{p:'mist',rate:20,eff:70},[{sid:2,d:ALL,s:400,sec:0},{sid:3,d:ALL,s:1110,sec:0}]),
      Z('Herb bed',1,2,41,{p:'med',kc:.5,root:35,lo:20,hi:40},{p:'sloam',fc:18,wp:8,inf:20},{p:'drip',rate:6,eff:90},[{sid:4,d:0x2A,s:420,sec:0}]),
      Z('Balcony pots',0,0,null,{p:'trop',kc:1.05,root:20,lo:45,hi:65},{p:'pot',fc:45,wp:10,inf:25},{p:'drip',rate:6,eff:90},[{sid:5,d:ALL,s:480,sec:300}])
    ],
    log:[],nextSid:6
  };
  M.z[3].sf=1;M.z[2].cov=0;M.z[1].dsch=[{sid:91,d:0x04,s:1080,e:1200}];
  // a few days of history
  (function(){
    var d,base=new Date();base.setHours(6,30,0,0);
    for(d=6;d>=1;d--){
      var t0=base.getTime()-d*864e5;
      if(d%2==1)M.log.push([Math.floor(t0/1000),lts(t0),1,'SCHEDULE',38,47,600,'21.0','DONE']);
      var t1=t0+10*60e3;
      if(d==3)M.log.push([Math.floor(t1/1000),lts(t1),2,'SCHEDULE',36,'',0,'','SKIP_RAIN']);
      else if(d%3==0)M.log.push([Math.floor(t1/1000),lts(t1),2,'SCHEDULE',34,49,420,'14.7','DONE']);
      if(d==4){var t2=t0+40*60e3;M.log.push([Math.floor(t2/1000),lts(t2),3,'SCHEDULE','','',360,'12.6','DONE'])}
    }
    var t3=base.getTime()-864e5+11*3600e3;M.log.push([Math.floor(t3/1000),lts(t3),1,'MANUAL','','',120,'4.2','USER']);
    // a few past problems: ALERT rows (zone 0 = system; level E error, W warning, I back to normal)
    var al=function(ms,z,code,lv){M.log.push([Math.floor(ms/1000),lts(ms),z,'ALERT',code,'','','',lv])},b0=base.getTime();
    al(b0-5*864e5+3*3600e3,0,'FAULT','E');al(b0-5*864e5+4*3600e3,0,'FAULT_OK','I');
    al(b0-3*864e5+7.5*3600e3,0,'TANK_LOW','W');al(b0-3*864e5+12*3600e3,0,'TANK_OK','I');
    al(b0-2*864e5+2*3600e3,4,'SOIL','W');
    M.log.sort(function(a,b){return a[0]-b[0]});
  })();

  // ---- cost: running totals per period, and COST rows in the log when a logged period ends ----
  var PER=['d','w','m','s','y'];
  function pStart(k,ms){var d=new Date(ms);d.setHours(0,0,0,0);
    if(k=='w')d.setDate(d.getDate()-(d.getDay()+6)%7);
    if(k=='m')d.setDate(1);
    if(k=='y'){d.setMonth(0,1)}
    return d.getTime()}
  function costOf(l,sec){var S=M.S;return S.cmode==1?l/1000*S.cpw:S.cmode==2?S.cpp*sec/3.6e6*S.cpe:0}
  // the controller only counts pump seconds per period; litres, kWh and cost are derived when shown or logged
  function costAdd(sec){PER.forEach(function(k){var x=M.ct[k];if(k=='s'&&!x.f)return;x.sec+=sec})}
  function costReset(){PER.forEach(function(k){var x=M.ct[k];x.sec=0;if(k!='s'||x.f)x.f=NOW()})}
  (function(){
    var n=NOW(),seed={d:0,w:0,m:380,s:2900,y:3100};   // earlier use this month/season/year, before the 6 days of log
    M.ct={};PER.forEach(function(k){var f=k=='s'?new Date(new Date(n).getFullYear(),3,4).getTime():pStart(k,n),x={f:f,sec:Math.round(seed[k]/M.S.flow*60)};
      M.log.forEach(function(r){if(r[2]>0&&+r[6]>0&&r[0]*1000>=f)x.sec+=+r[6]});
      M.ct[k]=x});
    // logged totals from earlier periods: last week, and the two months before this one
    var wk=pStart('w',n),m0=pStart('m',n),m1=new Date(m0);m1.setMonth(m1.getMonth()-1);var m2=new Date(m1);m2.setMonth(m2.getMonth()-1);
    [[wk,wk-7*864e5,'W',61],[m0,m1.getTime(),'M',412],[m1.getTime(),m2.getTime(),'M',655]].forEach(function(e){
      var l=e[3],sec=Math.round(l/M.S.flow*60);M.log.push([Math.floor(e[0]/1000),lts(e[0]),0,'COST',e[2],Math.floor(e[1]/1000),sec,l.toFixed(1),costOf(l,sec).toFixed(2)])});
    M.log.sort(function(a,b){return a[0]-b[0]});
  })();

  function nowS(){return Math.floor(NOW()/1000)}
  var PHYS=[[3020,1310],[2985,1290],[3050,1335],[3000,1300]];
  function rawOf(i){var zz=M.z[i];if(zz.soil==null||zz.sf||(i==2&&M.sf3))return null;return Math.round(PHYS[i][0]-(PHYS[i][0]-PHYS[i][1])*zz.soil/100)}
  function avail(z){return (z.soil_.fc-z.soil_.wp)/100*z.plant.root*10}            // mm of plant-available water in the root zone
  function pctPerSec(z){return (z.spr.rate*z.spr.eff/100/3600)/avail(z)*100}       // soil % gained per second of watering
  function deficit(z){
    var s=soilOf(z);if(s==null)return null;
    var mm=Math.max(0,(z.plant.hi-s)/100*avail(z)),gross=mm/(z.spr.eff/100);
    var sec=Math.min(3600,Math.round(gross/z.spr.rate*3600/10)*10);
    return {sec:sec,mm:Math.round(mm*10)/10};
  }
  function soilOf(z){var i=M.z.indexOf(z);if(z.sf||(i==2&&M.sf3&&z.m!=2))return null;return z.soil==null?null:Math.round(z.soil)}
  function dAt(ds,min){var a=/^(\d{4})-(\d\d)-(\d\d)$/.exec(ds||'');if(!a)return 0;return new Date(+a[1],+a[2]-1,+a[3],0,min).getTime()}
  function inRec(list,ms){            // weekly window list, local time ms
    var d=new Date(ms),k=(d.getDay()+6)%7,pk=(k+6)%7,m=d.getHours()*60+d.getMinutes();
    return list.some(function(x){
      if(!x.d){var f=dAt(x.dt,x.s),u=dAt(x.de||x.dt,x.e);return ms>=f&&ms<u}
      if(x.d&(1<<k)&&m>=x.s&&(x.e>x.s?m<x.e:true))return true;
      return x.e<=x.s&&(x.d&(1<<pk))&&m<x.e;
    });
  }
  function dndAt(i,ms){return ms/1000<M.g.dnd||ms/1000<M.z[i].dnd||inRec(M.g.dsch,ms)||inRec(M.z[i].dsch,ms)}
  function dndActive(i){return dndAt(i,NOW())}
  function gblk(){
    if(M.g.off)return 'ALL_OFF';
    if(!M.envFault&&M.c<M.S.frost)return 'FROST';
    if(M.tankLow)return 'TANK_LOW';
    return '';
  }
  var ALP=null;
  function alerts(){
    var now={TANK:M.tankLow?1:0,ENV:M.envFault?1:0,FAULT:M.flt?1:0,RTC:M.rtcLost?1:0,WIFI:M.weakWifi?1:0},k,t=NOW();
    M.z.forEach(function(z,i){now['SOIL'+(i+1)]=(z.sf||(i==2&&M.sf3))?1:0});
    if(ALP)for(k in now)if(now[k]!=ALP[k]){
      var z=k.indexOf('SOIL')==0?+k.slice(4):0,c=z?'SOIL':k,lv={TANK:'W',ENV:'W',SOIL:'W',FAULT:'E',RTC:'E',WIFI:'W'}[c];
      M.log.push([Math.floor(t/1000),lts(t),z,'ALERT',now[k]?(c=='TANK'?'TANK_LOW':c):c+'_OK','','','',now[k]?lv:'I']);
    }
    ALP=now;
  }
  function tick(){
    if(M.az<0)return;
    var z=M.z[M.az],el=(NOW()-M.runStart)/1000,dt=(NOW()-M.soilAt)/1000;M.soilAt=NOW();
    if(z.soil!=null)z.soil=Math.min(95,z.soil+dt*pctPerSec(z));
    if(el>=M.tot||M.tankLow||M.flt||M.g.off)finish(M.tankLow?'TANK_LOW':M.flt?'FAULT':el>=M.tot?'DONE':'USER');
  }
  function start(i,sec,src){M.az=i;M.runStart=NOW();M.soilAt=NOW();M.tot=sec;M.runSrc=src;M.z[i].soil0=soilOf(M.z[i])}
  function finish(why){
    var el=Math.min(M.tot,Math.round((NOW()-M.runStart)/1000)),z=M.z[M.az],t=NOW(),s1=soilOf(z);
    z.today+=el;
    M.log.push([Math.floor(t/1000),lts(t),M.az+1,M.runSrc,z.soil0==null?'':z.soil0,s1==null?'':s1,el,(el/60*M.S.flow).toFixed(1),why]);
    costAdd(el);
    M.az=-1;
    if(M.queue.length&&why=='DONE'){var q=M.queue.shift();start(q.i,q.sec,q.src)}else M.queue=[];
  }
  function nextRun(i){
    var z=M.z[i],n=new Date(NOW()),best=null,d,k,e,dt;
    for(d=0;d<8&&!best;d++){
      var day=new Date(n);day.setHours(0,0,0,0);day.setDate(day.getDate()+d);
      var wd=(day.getDay()+6)%7;
      var key=day.getFullYear()+'-'+p2(day.getMonth()+1)+'-'+p2(day.getDate());
      var es=z.sch.filter(function(x){return x.d?(x.d&(1<<wd)):x.dt==key}).sort(function(a,b){return a.s-b.s});
      for(k=0;k<es.length;k++){
        e=es[k];dt=new Date(day);dt.setMinutes(e.s);
        if(dt.getTime()>NOW()){best={t:Math.floor(dt.getTime()/1000),sec:z.m==0?e.sec:-1};break}
      }
    }
    if(!best)return null;
    var x='';
    if(M.g.off)x='ALL_OFF';
    else if(dndAt(i,best.t*1000))x='DND';
    else if(M.rain&&!z.cov)x='RAIN';
    if(x)best.x=x;
    return best;
  }
  function lastRun(i){
    for(var k=M.log.length-1;k>=0;k--){var r=M.log[k];if(r[2]==i+1&&r[3]!='ALERT'&&r[3]!='COST'&&r[8].indexOf('SKIP_')!=0)return {t:r[0],sec:r[6],r:r[8]}}
    return null;
  }
  function state(){
    tick();

function dayList(it,d){
  var H=DL.H,E=DL.E,y=0,prevEnd=null,rows=[];
  // this zone's waterings that start inside a DND window go inside that DND box
  var bands=it.filter(function(o){return o.k!='w'});
  it.forEach(function(o){
    if(o.k!='w'||o.zo)return;
    for(var i=0;i<bands.length;i++){var b=bands[i];if(o.s>=b.s&&o.s<b.e){o.in=b;(b.kids=b.kids||[]).push(o);return}}
  });
  // natural layout: height ~ duration, gap ~ idle time (both clamped)
  it.forEach(function(o){
    if(o.in)return;
    var len=o.e-o.s,h=Math.max(DL.MINH,Math.min(DL.MAXH,len*DL.PX)),g=0;
    if(prevEnd!=null){var idle=o.s-prevEnd;g=idle<=0?DL.MING:Math.max(DL.MING,Math.min(DL.MAXG,6+Math.sqrt(idle)*2.2))}
    y+=g;
    var row={o:o,y:y,h:h};rows.push(row);
    if(o.kids){
      // children below the DND title, roughly where they fall in the window, never overlapping
      var HEAD=50,KMIN=51,KMAX=64,pe=y+HEAD,kr=[];
      var need=HEAD+o.kids.reduce(function(a,c){return a+Math.max(KMIN,Math.min(KMAX,(c.e-c.s)*DL.PX))+6},0)+4;
      row.h=h=Math.max(h,need);
      o.kids.forEach(function(c){
        var ch=Math.max(KMIN,Math.min(KMAX,(c.e-c.s)*DL.PX)),f=(c.s-o.s)/((o.e-o.s)||1);
        var cy=Math.max(pe,y+HEAD+f*(h-HEAD-6-ch));kr.push({o:c,y:cy,h:ch,nest:1});pe=cy+ch+6;
      });
      if(pe+4>y+h)row.h=h=pe+4-y;
      rows.push.apply(rows,kr);
    }
    y+=h;
    prevEnd=prevEnd==null?o.e:Math.max(prevEnd,o.e);
  });
  var T=y,fits=T<=H,V=fits?T:H;
  var vp=el('div','dlv'+(fits?'':' sc')),sp=el('div','dls'),ly=el('div','dln');
  vp.style.height=V+6+'px';ly.style.height=V+6+'px';ly.style.marginBottom=-(V+6)+'px';sp.style.height=T+6+'px';
  rows.forEach(function(r){r.e=evBox(r.o);if(r.nest)r.e.className+=' nst';r.l1=r.e.querySelector('b');r.l2=r.e.querySelector('small');r.bd=r.e.querySelector('em');ly.appendChild(r.e)});
  // Near an edge that has more content beyond it, boxes are squeezed (height only). The squeeze
  // fades in with the amount hidden past that edge, so the top of the list starts at full size.
  function sq(u,k){return u>=E?u:(1-k)*u+k*(E-E*Math.tanh((E-u)/E))}
  function cl(x){return x<0?0:x>1?1:Math.round(x*100)/100}
  function lay(){
    var st=fits?0:vp.scrollTop,kt=Math.min(1,st/E),kb=Math.min(1,(T-st-H)/E);
    // pinned to the list's edges: a squeezed entry keeps its top at the top (or its bottom at the bottom) and only shrinks
    function m(yy){var u=yy-st;if(fits)return u;u=sq(u,kt);u=H-sq(H-u,Math.max(0,kb));return Math.max(0,Math.min(H,u))}
    rows.forEach(function(r){

      var a1=cl((hh-14)/10),a2=cl((hh-41)/9);

      r.e.style.setProperty('--bi',Math.min(5,hh/5)+'px');var pt=Math.max(0,Math.min(8,(hh-20)/2));r.e.style.paddingTop=pt+'px';r.e.style.paddingBottom=Math.min(8,pt)+'px';r.e.style.borderRadius=Math.min(8,hh/2)+'px';
      r.l1.style.opacity=a1;r.l2.style.opacity=a2;if(r.bd)r.bd.style.opacity=a2;
    });
  }
  if(!fits){
    vp.addEventListener('scroll',function(){if(!vp._r){vp._r=1;requestAnimationFrame(function(){vp._r=0;lay()})}},{passive:true});
    // open with the next entry still to come (or the first) near the middle

    setTimeout(function(){vp.scrollTop=Math.max(0,tg.y+tg.h/2-H/2);lay()},0);
  }
  vp.appendChild(ly);vp.appendChild(sp);
  lay();
  return vp;
}

// Grass is a grid of typed arrays, painted into its own cached layer a third per frame (3 batched strokes); a cut cell
